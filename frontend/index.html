<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dzhira</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
    <!-- The roughen filter used by the "paint" theme: turbulence displaces element outlines into
         shaky, half-disconnected hand-drawn strokes. Hidden; referenced via filter: url(#paintRough). -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <filter id="paintRough" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="turbulence" baseFrequency="0.02 0.025" numOctaves="3" seed="8" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/client.js"></script>
</body>
</html>
